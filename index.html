<body>
  <div class="menu-container">
    <h1 class="menu-title" style="line-height: 1.6;">Hello, I'm <span class="highlight">Abd-Alaziz</span></h1>
    <p style="line-height: 1.6;">A curious mind passionate about data, games, and technology</p>
    <a href="about.html" class="menu-button" data-theme="about">
      <img src="assets/gun.png" alt="gun" class="game-icon"> <span class="words">About</span>
    </a>
    <a href="projects.html" class="menu-button" data-theme="projects">
      <img src="assets/sword_2788484.png" alt="sword" class="game-icon"> <span class="words">Projects</span>
    </a>

    <!-- <a href="skills.html" class="menu-button" data-theme="skills">
       <img src="assets/hand_3704572.png" alt="hand" class="game-icon"> <span class="words">Skills</span>
    </a> -->

    <a href="contact.html" class="menu-button" data-theme="contact">

    </a>
  </div>

  <script>
    // Select all menu buttons
    const buttons = document.querySelectorAll('.menu-button');

    // Add event listeners for desktop hover effect
    buttons.forEach(button => {
      button.addEventListener('mouseenter', () => {
        button.classList.add(`${button.dataset.theme}-hover`);
      });
      button.addEventListener('mouseleave', () => {
        button.classList.remove(`${button.dataset.theme}-hover`);
      });

      // Add touchstart and touchend for mobile interaction
      button.addEventListener('touchstart', () => {
        button.classList.add(`${button.dataset.theme}-hover`);
      });
      button.addEventListener('touchend', () => {
        button.classList.remove(`${button.dataset.theme}-hover`);
      });
    });
  </script>
</body>
</html>
